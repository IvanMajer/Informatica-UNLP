               const posicion = text.indexOf("ipsum");
 
               if (posicion !== -1){
                   console.log("se encontro : ",posicion);
                }else{
                   console.log("NO SE ENCONTRO");
                }
 
           return text.length;  // Devuelve el número de caracteres en 'texto'
